name: Build and Publish

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      XRAY_REPO: XTLS/Xray-core
      GHCR_IMAGE: ghcr.io/medium1992/xray-remnasub-ros
      DOCKERHUB_IMAGE: medium1992/xray-remnasub-ros
      PACKAGE_OWNER: medium1992
      PACKAGE_NAME: xray-remnasub-ros
      DELETE_UNTAGGED: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Resolve Xray release
        run: |
          set -euo pipefail

          # Самый свежий релиз, включая pre-release. Черновики пропускаем:
          # у них ещё нет ассетов.
          xray=$(curl -fsSL --retry 5 --retry-all-errors \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${XRAY_REPO}/releases?per_page=20" | \
            jq -r '[.[] | select(.draft == false)] | sort_by(.published_at) | last | .tag_name // empty')

          if ! printf '%s' "${xray}" | grep -Eq '^v[0-9]+(\.[0-9]+){2}([.-][0-9A-Za-z]+)*$'; then
            echo "Invalid Xray release tag: ${xray}" >&2
            exit 1
          fi

          release=$(curl -fsSL --retry 5 --retry-all-errors \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${XRAY_REPO}/releases/tags/${xray}")

          for asset in \
            Xray-linux-64.zip \
            Xray-linux-arm64-v8a.zip \
            Xray-linux-arm32-v7a.zip \
            Xray-linux-arm32-v5.zip; do
            printf '%s' "${release}" | jq -e --arg asset "${asset}" \
              'any(.assets[]; .name == $asset)' >/dev/null || {
                echo "Release ${xray} has no ${asset}" >&2
                exit 1
              }
          done

          echo "xray=${xray}" >> "${GITHUB_ENV}"
          echo "Resolved Xray ${xray}"

      - name: Decide whether a build is needed
        id: check
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "Manual run: forcing a build"
            echo "build_needed=true" >> "${GITHUB_OUTPUT}"
          elif grep -qx "xray=${xray}" VERSIONS && \
               grep -qx "xray_release_repo=${XRAY_REPO}" VERSIONS; then
            echo "Xray ${xray} is already published"
            echo "build_needed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "New Xray release: ${xray}"
            echo "build_needed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up QEMU
        if: steps.check.outputs.build_needed == 'true'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all
          cache-image: false

      - name: Set up Docker Buildx
        if: steps.check.outputs.build_needed == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.check.outputs.build_needed == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.check.outputs.build_needed == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish multi-architecture image
        if: steps.check.outputs.build_needed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v5
          push: true
          provenance: false
          sbom: false
          build-args: |
            XRAY_VERSION=${{ env.xray }}
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ env.xray }}
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.DOCKERHUB_IMAGE }}:${{ env.xray }}
            ${{ env.DOCKERHUB_IMAGE }}:latest
          labels: |
            org.opencontainers.image.title=xray-remnasub-ros
            org.opencontainers.image.description=Xray RemnaSub container for MikroTik RouterOS
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.xray }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export RouterOS archives
        if: steps.check.outputs.build_needed == 'true'
        run: |
          set -euo pipefail
          mkdir -p dist

          verify_archive() {
            archive=$1
            members=$(tar -tf "${archive}")
            printf '%s\n' "${members}" | grep -Eq '^(\./)?manifest\.json$'
            printf '%s\n' "${members}" | grep -Eq '^(\./)?repositories$'
            printf '%s\n' "${members}" | grep -Eq '(^|/)layer\.tar$'
            if printf '%s\n' "${members}" | grep -Eq '(^|/)(oci-layout|index\.json)$|^(\./)?blobs/'; then
              echo "OCI layout is not compatible with RouterOS: ${archive}" >&2
              return 1
            fi
          }

          export_image() {
            name=$1
            architecture=$2
            variant=${3:-}
            archive="dist/xray-remnasub-ros-${xray}-${name}.tar"
            set -- --override-os linux --override-arch "${architecture}"
            [ -z "${variant}" ] || set -- "$@" --override-variant "${variant}"
            docker run --rm \
              -v "${HOME}/.docker/config.json:/auth.json:ro" \
              -v "${PWD}/dist:/dist" \
              quay.io/skopeo/stable:latest \
              "$@" copy \
              --authfile /auth.json \
              --format v2s2 \
              --retry-times 5 \
              "docker://${GHCR_IMAGE}:${xray}" \
              "docker-archive:/dist/${archive##*/}:xray-remnasub-ros:${xray}"
            verify_archive "${archive}"
            gzip -9 "${archive}"
          }

          export_image amd64 amd64
          export_image arm64 arm64 v8
          export_image armv7 arm v7
          export_image armv5 arm v5
          (cd dist && sha256sum ./*.tar.gz > sha256sums.txt)

      - name: Upload RouterOS archives
        if: steps.check.outputs.build_needed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: xray-remnasub-ros-${{ env.xray }}
          path: |
            dist/*.tar.gz
            dist/sha256sums.txt
          if-no-files-found: error
          compression-level: 0

      - name: Record published version
        if: steps.check.outputs.build_needed == 'true'
        run: |
          set -euo pipefail
          printf 'xray=%s\nxray_release_repo=%s\n' "${xray}" "${XRAY_REPO}" > VERSIONS
          if git diff --quiet -- VERSIONS; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add VERSIONS
          git commit -m "Auto-update: Xray ${xray}"
          git push

      # Те же архивы, что и в артефактах. Без секретов шаг пропускается.
      - name: Publish RouterOS archives to Telegram
        if: steps.check.outputs.build_needed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram secrets are not configured, skipping Telegram publish."
            exit 0
          fi

          telegram_api() {
            method=$1
            shift
            response=$(curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/${method}" "$@")
            echo "${response}" | grep -q '"ok":true' || {
              echo "Telegram API call failed:"
              echo "${response}"
              exit 1
            }
          }

          thread_data_args=()
          thread_form_args=()
          if [ -n "${TELEGRAM_THREAD_ID}" ]; then
            thread_data_args=(-d "message_thread_id=${TELEGRAM_THREAD_ID}")
            thread_form_args=(-F "message_thread_id=${TELEGRAM_THREAD_ID}")
          fi

          files_list=$(find dist -maxdepth 1 -name '*.tar.gz' -type f -printf '%f\n' | sort)
          message=$(printf 'xray-remnasub-ros container images\n\nXray: %s\n\nDocker Hub: https://hub.docker.com/r/%s\nGHCR: %s\n\nFiles:\n%s\n\nChecksums: sha256sums.txt' \
            "${xray}" "${DOCKERHUB_IMAGE}" "${GHCR_IMAGE}" "${files_list}")

          telegram_api sendMessage \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            "${thread_data_args[@]}" \
            --data-urlencode "text=${message}"

          while IFS= read -r file; do
            telegram_api sendDocument \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              "${thread_form_args[@]}" \
              -F "document=@${file}" \
              -F "caption=$(basename "${file}")"
          done < <(find dist -maxdepth 1 -name '*.tar.gz' -type f | sort)

          telegram_api sendDocument \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            "${thread_form_args[@]}" \
            -F "document=@dist/sha256sums.txt" \
            -F "caption=sha256sums.txt"

      - name: Install crane
        if: steps.check.outputs.build_needed == 'true' && env.DELETE_UNTAGGED == 'true'
        run: |
          set -euo pipefail
          curl -sL https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz \
            | sudo tar -C /usr/local/bin -xz crane
          sudo chmod +x /usr/local/bin/crane
          crane version

      - name: Log in to GHCR with crane
        if: steps.check.outputs.build_needed == 'true' && env.DELETE_UNTAGGED == 'true'
        run: echo "${GITHUB_TOKEN}" | crane auth login ghcr.io -u "${PACKAGE_OWNER}" --password-stdin

      # Платформенные образы под индексом тоже без тегов, поэтому сначала
      # обходим теги через crane и защищаем их дочерние digest.
      - name: Analyze GHCR package versions
        if: steps.check.outputs.build_needed == 'true' && env.DELETE_UNTAGGED == 'true'
        id: analyze
        run: |
          set -euo pipefail

          page=1
          packages_json='[]'
          while [ "${page}" -le 10 ]; do
            chunk=$(gh api -H "Accept: application/vnd.github+json" \
              "/users/${PACKAGE_OWNER}/packages/container/${PACKAGE_NAME}/versions?per_page=100&page=${page}")
            [ "$(echo "${chunk}" | jq 'length')" -gt 0 ] || break
            packages_json=$(jq -s '.[0] + .[1]' <(echo "${packages_json}") <(echo "${chunk}"))
            page=$((page + 1))
          done
          echo "Total versions: $(echo "${packages_json}" | jq 'length')"

          protected=$(mktemp)
          while IFS=$'\t' read -r digest tags; do
            [ -n "${digest}" ] || continue
            echo "${digest}" >> "${protected}"
            echo "tagged ${digest} [${tags}]"
            crane manifest "ghcr.io/${PACKAGE_OWNER}/${PACKAGE_NAME}@${digest}" 2>/dev/null \
              | jq -r '(.manifests // [])[].digest // empty' >> "${protected}" || true
          done < <(echo "${packages_json}" | jq -r '
            .[] | select((.metadata.container.tags // []) | length > 0)
            | [ .name, ((.metadata.container.tags // []) | join(",")) ] | @tsv')

          sort -u "${protected}" -o "${protected}"

          removable=$(echo "${packages_json}" | jq -r '
            .[] | select((.metadata.container.tags // []) | length == 0)
            | [ .id, .name ] | @tsv' \
            | while IFS=$'\t' read -r id digest; do
                grep -qxF "${digest}" "${protected}" || printf '%s\n' "${id}"
              done | paste -sd, -)

          echo "Removable version ids: ${removable:-<none>}"
          echo "removable=${removable}" >> "${GITHUB_OUTPUT}"

      - name: Delete untagged GHCR versions
        if: steps.analyze.outputs.removable != ''
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ env.PACKAGE_NAME }}
          package-type: container
          package-version-ids: ${{ steps.analyze.outputs.removable }}
          token: ${{ secrets.GITHUB_TOKEN }}
