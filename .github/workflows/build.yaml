name: Build and Publish

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      xray_version:
        description: "Xray release tag; leave empty to rebuild the version in VERSIONS"
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Пять с лишним тысяч строк shell собираются в образ без единой проверки —
  # опечатка доезжала до роутера. Джоба быстрая и идёт перед сборкой.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check POSIX shell syntax
        run: |
          set -euo pipefail
          for script in entrypoint.sh lib.sh web/cgi-bin/api scripts/*.sh tests/*.sh; do
            dash -n "${script}"
          done

      # Уровень намеренно выставлен в error: код никогда не проходил
      # shellcheck, и объём накопившихся warning/info неизвестен, а гейт,
      # который падает на первом же запуске, никому не помогает. Разбирайте
      # вывод соседнего шага и поднимайте severity до warning, когда список
      # будет вычищен.
      - name: Run shellcheck
        run: |
          set -euo pipefail
          shellcheck --shell=dash --external-sources --severity=error \
            entrypoint.sh lib.sh web/cgi-bin/api scripts/*.sh tests/*.sh

      - name: Report remaining shellcheck warnings
        continue-on-error: true
        run: |
          shellcheck --shell=dash --external-sources --severity=warning \
            entrypoint.sh lib.sh web/cgi-bin/api scripts/*.sh tests/*.sh

      - name: Check web assets
        run: |
          set -euo pipefail
          for script in web/assets/app.js web/assets/theme.js; do
            node --check "${script}"
          done

  build:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      XRAY_REPO: XTLS/Xray-core
      GHCR_IMAGE: ghcr.io/medium1992/xray-remnasub-ros
      DOCKERHUB_IMAGE: medium1992/xray-remnasub-ros
      REQUESTED_VERSION: ${{ inputs.xray_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Resolve Xray release
        run: |
          set -euo pipefail

          if [ -n "${REQUESTED_VERSION}" ]; then
            xray="${REQUESTED_VERSION}"
            update_latest=false
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            xray=$(awk -F= '$1 == "xray" { print $2; exit }' VERSIONS)
            update_latest=true
          else
            xray=$(curl -fsSL --retry 5 --retry-all-errors \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${XRAY_REPO}/releases?per_page=20" | \
              jq -r '[.[] | select(.draft == false and .prerelease == false)] | sort_by(.published_at) | last | .tag_name // empty')
            update_latest=true
          fi

          if ! printf '%s' "${xray}" | grep -Eq '^v[0-9]+(\.[0-9]+){2}([.-][0-9A-Za-z]+)*$'; then
            echo "Invalid Xray release tag: ${xray}" >&2
            exit 1
          fi

          release=$(curl -fsSL --retry 5 --retry-all-errors \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${XRAY_REPO}/releases/tags/${xray}")

          for asset in \
            Xray-linux-64.zip \
            Xray-linux-arm64-v8a.zip \
            Xray-linux-arm32-v7a.zip \
            Xray-linux-arm32-v5.zip; do
            printf '%s' "${release}" | jq -e --arg asset "${asset}" \
              'any(.assets[]; .name == $asset)' >/dev/null || {
                echo "Release ${xray} has no ${asset}" >&2
                exit 1
              }
          done

          echo "xray=${xray}" >> "${GITHUB_ENV}"
          echo "UPDATE_LATEST=${update_latest}" >> "${GITHUB_ENV}"
          echo "Resolved Xray ${xray}"

      - name: Decide whether a build is needed
        id: check
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "Manual run: forcing a build"
            echo "build_needed=true" >> "${GITHUB_OUTPUT}"
          elif grep -qx "xray=${xray}" VERSIONS && \
               grep -qx "xray_release_repo=${XRAY_REPO}" VERSIONS; then
            echo "Xray ${xray} is already published"
            echo "build_needed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "New Xray release: ${xray}"
            echo "build_needed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up QEMU
        if: steps.check.outputs.build_needed == 'true'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all
          cache-image: false

      - name: Set up Docker Buildx
        if: steps.check.outputs.build_needed == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build amd64 smoke image
        if: steps.check.outputs.build_needed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          build-args: |
            XRAY_VERSION=${{ env.xray }}
          tags: xray-remnasub-ros:smoke
          cache-from: type=gha

      - name: Run amd64 smoke tests
        if: steps.check.outputs.build_needed == 'true'
        run: /bin/sh ./tests/smoke.sh xray-remnasub-ros:smoke

      - name: Log in to GHCR
        if: steps.check.outputs.build_needed == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.check.outputs.build_needed == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare image tags
        if: steps.check.outputs.build_needed == 'true'
        run: |
          set -euo pipefail
          {
            echo 'IMAGE_TAGS<<EOF'
            echo "${GHCR_IMAGE}:${xray}"
            echo "${DOCKERHUB_IMAGE}:${xray}"
            if [ "${UPDATE_LATEST}" = true ]; then
              echo "${GHCR_IMAGE}:latest"
              echo "${DOCKERHUB_IMAGE}:latest"
            fi
            echo EOF
          } >> "${GITHUB_ENV}"

      - name: Build and publish multi-architecture image
        if: steps.check.outputs.build_needed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v5
          push: true
          provenance: false
          sbom: false
          build-args: |
            XRAY_VERSION=${{ env.xray }}
          tags: ${{ env.IMAGE_TAGS }}
          labels: |
            org.opencontainers.image.title=xray-remnasub-ros
            org.opencontainers.image.description=Xray RemnaSub container for MikroTik RouterOS
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.xray }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export RouterOS archives
        if: steps.check.outputs.build_needed == 'true'
        run: |
          set -euo pipefail
          mkdir -p dist

          verify_archive() {
            archive=$1
            members=$(tar -tf "${archive}")
            printf '%s\n' "${members}" | grep -Eq '^(\./)?manifest\.json$'
            printf '%s\n' "${members}" | grep -Eq '^(\./)?repositories$'
            printf '%s\n' "${members}" | grep -Eq '(^|/)layer\.tar$'
            if printf '%s\n' "${members}" | grep -Eq '(^|/)(oci-layout|index\.json)$|^(\./)?blobs/'; then
              echo "OCI layout is not compatible with RouterOS: ${archive}" >&2
              return 1
            fi
          }

          export_image() {
            name=$1
            architecture=$2
            variant=${3:-}
            archive="dist/xray-remnasub-ros-${xray}-${name}.tar"
            set -- --override-os linux --override-arch "${architecture}"
            [ -z "${variant}" ] || set -- "$@" --override-variant "${variant}"
            docker run --rm \
              -v "${HOME}/.docker/config.json:/auth.json:ro" \
              -v "${PWD}/dist:/dist" \
              quay.io/skopeo/stable:latest \
              "$@" copy \
              --authfile /auth.json \
              --format v2s2 \
              --retry-times 5 \
              "docker://${GHCR_IMAGE}:${xray}" \
              "docker-archive:/dist/${archive##*/}:xray-remnasub-ros:${xray}"
            verify_archive "${archive}"
            gzip -9 "${archive}"
          }

          export_image amd64 amd64
          export_image arm64 arm64 v8
          export_image armv7 arm v7
          export_image armv5 arm v5
          (cd dist && sha256sum ./*.tar.gz > sha256sums.txt)

      - name: Upload RouterOS archives
        if: steps.check.outputs.build_needed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: xray-remnasub-ros-${{ env.xray }}
          path: |
            dist/*.tar.gz
            dist/sha256sums.txt
          if-no-files-found: error
          compression-level: 0

      - name: Record published version
        if: steps.check.outputs.build_needed == 'true' && env.UPDATE_LATEST == 'true'
        run: |
          set -euo pipefail
          printf 'xray=%s\nxray_release_repo=%s\n' "${xray}" "${XRAY_REPO}" > VERSIONS
          if git diff --quiet -- VERSIONS; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add VERSIONS
          git commit -m "Auto-update: Xray ${xray}"
          git push
