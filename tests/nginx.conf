events {}

http {
  access_log off;
  server_tokens off;

  server {
    listen 80;

    location = /subscription.json {
      alias /fixtures/subscription-e2e.json;
      default_type application/json;
      add_header Profile-Title "E2E Subscription";
      add_header Profile-Update-Interval "12";
      add_header Subscription-Userinfo "upload=1024; download=2048; total=4096; expire=1893456000";
      add_header Announce "Planned maintenance";
      add_header Support-Url "https://example.com/support";
      add_header Profile-Web-Page-Url "https://example.com/account";
      add_header Subscription-Refill-Date "1890864000";
      add_header X-Hwid-Active "true";
    }

    location = /malformed.json {
      alias /fixtures/malformed-subscription.json;
      default_type application/json;
    }

    location = /denied.json {
      return 403;
    }

    location = /hwid.json {
      alias /fixtures/subscription-e2e.json;
      default_type application/json;
      add_header X-Hwid-Max-Devices-Reached "true";
    }
  }
}
